<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>R Pocket</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f5f3; --text: #1d1d1b; --muted: #6b6b66; --faint: #a3a29c;
  --border: rgba(0,0,0,.12); --border2: rgba(0,0,0,.25);
  --accent: #276dc3; --on-accent: #ffffff; --accent-bg: #e6f1fb;
  --ok: #3b6d11; --ok-bg: #eaf3de; --warn: #854f0b; --warn-bg: #faeeda; --err: #a32d2d; --err-bg: #fcebeb;
  --curline: rgba(39,109,195,.08);
  --hl-com: #8a8983; --hl-str: #3b7d23; --hl-num: #a85a0b; --hl-kw: #7a3fb0; --hl-const: #b8462b;
  --hl-fn: #1f5fae; --hl-arg: #0f7a6e; --hl-ns: #6b6b66; --hl-op: #a03d6a;
  --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", monospace;
  --lh: 21px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1f1e; --bg2: #2a2a28; --text: #ecebe6; --muted: #a8a7a0; --faint: #74736d;
    --border: rgba(255,255,255,.12); --border2: rgba(255,255,255,.28);
    --accent: #5b9be6; --on-accent: #0b1a2c; --accent-bg: #0c2a4d;
    --ok: #97c459; --ok-bg: #22330f; --warn: #ef9f27; --warn-bg: #3a2604; --err: #f09595; --err-bg: #3d1414;
    --curline: rgba(91,155,230,.12);
    --hl-com: #8c8b84; --hl-str: #97c459; --hl-num: #f0a35a; --hl-kw: #c5a3f0; --hl-const: #f0997b;
    --hl-fn: #85b7eb; --hl-arg: #5dcaa5; --hl-ns: #a8a7a0; --hl-op: #ed93b1;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Roboto", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: transparent; border: 0.5px solid var(--border2);
  border-radius: 8px; padding: 8px 12px; min-height: 40px; }
button:active { background: var(--bg2); }
.icon { border: 0; padding: 8px; min-width: 40px; font-size: 18px; }
header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 0.5px solid var(--border); }
header h1 { font-size: 18px; font-weight: 600; margin: 0; color: var(--accent); }
#status { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 0; min-height: 0; background: var(--bg2); color: var(--muted); }
#status.ok { background: var(--ok-bg); color: var(--ok); }
#status.busy { background: var(--warn-bg); color: var(--warn); }
#status.bad { background: var(--err-bg); color: var(--err); }
.spacer { flex: 1; }
#scriptbar { display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 12px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
#scriptName { border: 0; min-height: 34px; padding: 4px 6px; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
#scriptName b { color: var(--text); font-weight: 600; }
#saveBtn { min-height: 32px; padding: 4px 12px; font-size: 13px; }
#edwrap { position: relative; flex: 1 1 38%; min-height: 100px; display: flex; background: var(--bg2); border-bottom: 0.5px solid var(--border); overflow: hidden; }
#gutter { flex: none; min-width: 36px; padding: 10px 6px 56px 6px; font: 12px/var(--lh) var(--mono); color: var(--faint);
  text-align: right; overflow: hidden; user-select: none; border-right: 0.5px solid var(--border); }
#gutter div { height: var(--lh); padding: 0 2px; border-radius: 4px; }
#gutter div.cur { color: var(--text); background: var(--curline); }
#gutter div.lint { color: var(--warn); background: var(--warn-bg); }
#gutter div.bad { color: var(--err); background: var(--err-bg); font-weight: 600; }
.edbox { position: relative; flex: 1; min-width: 0; }
#hl, #editor { position: absolute; inset: 0; margin: 0; font: 14px/var(--lh) var(--mono); padding: 10px 12px 56px 8px;
  tab-size: 2; white-space: pre; letter-spacing: 0; }
#hl { overflow: hidden; pointer-events: none; color: var(--text); }
#editor { width: 100%; height: 100%; color: transparent; caret-color: var(--text); -webkit-text-fill-color: transparent; }
#editor::placeholder { color: var(--faint); -webkit-text-fill-color: var(--faint); }
#editor::selection { background: rgba(39,109,195,.28); }
.tk-com { color: var(--hl-com); font-style: italic; }
.tk-str { color: var(--hl-str); }
.tk-num { color: var(--hl-num); }
.tk-kw { color: var(--hl-kw); }
.tk-const { color: var(--hl-const); }
.tk-fn { color: var(--hl-fn); }
.tk-arg { color: var(--hl-arg); }
.tk-ns { color: var(--hl-ns); }
.tk-op { color: var(--hl-op); }
#editor { resize: none; border: 0; background: transparent; outline: none; overflow: auto; }
#diag { display: none; padding: 6px 12px; font-size: 12.5px; border-bottom: 0.5px solid var(--border); }
#diag.bad { display: block; background: var(--err-bg); color: var(--err); }
#symbols { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; border-bottom: 0.5px solid var(--border); scrollbar-width: none; }
#symbols::-webkit-scrollbar { display: none; }
#symbols button { font-family: var(--mono); min-width: 40px; min-height: 34px; padding: 4px 10px; flex: none; }
#runbar { display: flex; gap: 8px; padding: 8px; border-bottom: 0.5px solid var(--border); }
#runbar button { flex: 1; }
#runAll { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
#runbar #stopBtn { flex: 0 0 auto; }
#tabs { display: flex; border-bottom: 0.5px solid var(--border); }
#tabs button { flex: 1; border: 0; border-radius: 0; color: var(--muted); border-bottom: 2px solid transparent; padding: 8px 4px; }
#tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.pane { flex: 1 1 45%; min-height: 0; overflow: auto; display: none; }
.pane.on { display: block; }
#console.on { display: flex; flex-direction: column; overflow: hidden; }
#consoleOut { flex: 1; min-height: 0; overflow: auto; font: 12.5px/1.45 var(--mono); padding: 8px 12px 12px; white-space: pre; }
#consoleIn { display: flex; align-items: flex-end; gap: 4px; padding: 4px 6px; border-top: 0.5px solid var(--border); background: var(--bg2); }
#consoleIn .prompt { font: 14px/var(--lh) var(--mono); color: var(--accent); padding: 8px 0 8px 6px; }
#cmd { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--text); font: 14px/var(--lh) var(--mono);
  padding: 8px 4px; outline: none; height: calc(var(--lh) + 16px); max-height: calc(var(--lh) * 5 + 16px); overflow-y: auto; white-space: pre; }
#consoleIn button { min-height: 36px; min-width: 36px; padding: 4px 8px; border: 0; color: var(--muted); }
#consoleIn #cmdRun { color: var(--accent); font-weight: 600; }
.in { color: var(--text); margin-top: 6px; }
.out { color: var(--muted); }
.msg { color: var(--muted); font-style: italic; }
.warn { color: var(--warn); white-space: pre-wrap; }
.err { color: var(--err); white-space: pre-wrap; }
.hint { font-family: system-ui, sans-serif; white-space: normal; color: var(--muted); padding: 12px 0; }
#plots { padding: 10px; text-align: center; }
#plots img { max-width: 100%; background: #fff; border-radius: 8px; border: 0.5px solid var(--border); }
.plotnav { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.saved { color: var(--ok); }
.crumbs { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 0.5px solid var(--border); font-size: 13px; color: var(--muted); }
.crumbs .where { flex: 1; word-break: break-all; }
.crumbs button { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 0.5px solid var(--border); }
.row .name { flex: 1; word-break: break-all; }
.row .size { color: var(--faint); font-size: 12px; }
.wd { font-size: 12px; color: var(--muted); padding: 8px 14px; word-break: break-all; }
.lintbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); font-size: 13px; color: var(--muted); }
.lintbar span { flex: 1; }
.lintrow { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.lintrow .loc { font-family: var(--mono); color: var(--muted); flex: none; min-width: 52px; }
.lintrow .t-error { color: var(--err); }
.lintrow .t-warning { color: var(--warn); }
.lintrow .t-style { color: var(--accent); }
.lintrow .linter { display: block; color: var(--faint); font-size: 12px; font-family: var(--mono); }
#suggest { display: none; gap: 6px; padding: 5px 6px; overflow-x: auto; scrollbar-width: none; background: var(--bg);
  border-top: 0.5px solid var(--border2); }
#suggest::-webkit-scrollbar { display: none; }
#suggest.on { display: flex; }
#suggest.in-editor { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; }
#suggest button { flex: none; min-height: 32px; padding: 3px 10px; font: 13px var(--mono); border-radius: 6px; background: var(--bg2); border: 0.5px solid var(--border); }
#suggest button.k-fn { color: var(--hl-fn); }
#suggest button.k-arg { color: var(--hl-arg); }
#suggest button.k-file { color: var(--hl-str); }
#suggest button.k-kw { color: var(--hl-kw); }
#suggest button.k-other { color: var(--muted); }
.pkgform { display: flex; gap: 8px; padding: 10px; border-bottom: 0.5px solid var(--border); }
.pkgform input { flex: 1; min-width: 0; font: 14px var(--mono); color: var(--text); background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.pkgrow { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.pkgrow .name { flex: 1; font-family: var(--mono); word-break: break-all; }
.pkgrow .ok { color: var(--ok); }
.pkgrow .bad { color: var(--err); }
.pkgrow .wait { color: var(--muted); }
.card { margin: 12px; padding: 14px; border: 0.5px solid var(--border2); border-radius: 12px; font-family: system-ui, sans-serif; white-space: normal; color: var(--text); }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.card ol { padding-left: 20px; margin: 8px 0; }
.card li { margin: 6px 0; }
.card code { font-family: var(--mono); font-size: 12px; background: var(--bg2); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
#sheetWrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; z-index: 10; }
#sheetWrap.on { display: flex; }
#sheet { background: var(--bg); width: 100%; max-height: 80%; overflow: auto; border-radius: 16px 16px 0 0; padding: 8px 0 16px; }
#sheet h2 { font-size: 16px; margin: 8px 16px 12px; }
#sheet img { display: block; max-width: calc(100% - 32px); margin: 0 16px 8px; background: #fff; border-radius: 8px; }
.sheetrow { display: flex; align-items: center; gap: 8px; padding: 6px 16px; }
.sheetrow input { flex: 1; font: inherit; color: var(--text); background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px 10px; min-height: 40px; min-width: 0; }
.fielderr { color: var(--err); font-size: 13px; padding: 0 16px; }
.item { display: flex; align-items: center; border-top: 0.5px solid var(--border); }
.item button.main { flex: 1; text-align: left; border: 0; border-radius: 0; padding: 12px 16px; }
.item .sub { display: block; font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80vw; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 20; max-width: 90%; }
</style>
</head>
<body>
<header>
  <h1>R</h1>
  <button id="status" onclick="statusTapped()">Checking…</button>
  <span class="spacer"></span>
  <button class="icon" aria-label="Snippets" onclick="openSnippets()">&#9733;</button>
  <button class="icon" aria-label="Menu" onclick="openMenu()">&#8942;</button>
</header>

<div id="scriptbar">
  <button id="scriptName" onclick="openScripts()">&#128196; <b>untitled.R</b></button>
  <button id="saveBtn" onclick="saveScript()">Save</button>
</div>

<div id="edwrap">
  <div id="gutter" aria-hidden="true"></div>
  <div id="suggest" class="in-editor" role="listbox" aria-label="Suggestions"></div>
  <div class="edbox">
  <pre id="hl" aria-hidden="true"></pre>
  <textarea id="editor" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
    placeholder="# Type R code here&#10;summary(mtcars)"></textarea>
  </div>
</div>
<div id="diag"></div>

<div id="symbols"></div>

<div id="runbar">
  <button id="runAll" onclick="runAll()">&#9654; Run all</button>
  <button onclick="runLine()">Run line</button>
  <button id="stopBtn" aria-label="Restart R" onclick="restartR()">&#9632;</button>
</div>

<div id="tabs">
  <button data-tab="console" class="on" onclick="showTab('console')">Console</button>
  <button data-tab="plots" onclick="showTab('plots')">Plots</button>
  <button data-tab="files" onclick="showTab('files')">Files</button>
  <button data-tab="lint" onclick="showTab('lint')">Lint</button>
  <button data-tab="pkgs" onclick="showTab('pkgs')">Packages</button>
</div>

<div id="console" class="pane on">
  <div id="consoleOut"></div>
  <div id="consoleIn">
    <span class="prompt">&gt;</span>
    <textarea id="cmd" rows="1" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
      enterkeyhint="send" placeholder="Type R code and press Enter" aria-label="Console input"></textarea>
    <button aria-label="Previous command" onclick="historyStep(-1)">&#8593;</button>
    <button aria-label="Next command" onclick="historyStep(1)">&#8595;</button>
    <button id="cmdRun" aria-label="Run" onclick="runCommand()">&#9166;</button>
  </div>
</div>
<div id="plots" class="pane"><div class="hint">Plots you make show up here.</div></div>
<div id="files" class="pane"></div>
<div id="lint" class="pane"></div>
<div id="pkgs" class="pane">
  <div class="pkgform">
    <input id="pkgName" placeholder="dplyr tidyr  or  user/repo" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Packages to install">
    <button class="primary" onclick="installPackages()">Install</button>
  </div>
  <div class="fielderr" id="pkgErr"></div>
  <div class="wd">Separate several packages with spaces or commas. For a GitHub package, type <b>user/repo</b>. Details appear in the Console.</div>
  <div id="pkgLog"></div>
</div>

<div id="sheetWrap" onclick="if (event.target === this) closeSheet()"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const editor = $("editor");
const cmd = $("cmd");
const gutter = $("gutter");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const SETUP_CMD = "curl -fsSL https://raw.githubusercontent.com/Spartan1203/cluade_r/main/termux/setup.sh | bash";
const LINTR_CMD = "pkg install -y libxml2 && Rscript -e 'install.packages(\"lintr\", repos = \"https://cloud.r-project.org\")'";
const LH = 21;

let state = "checking";   // checking | starting | ready | busy | down
let rVersion = "";
let hasLintr = false;
let plots = [];           // { src, name, saved }
let plotIndex = -1;
let filesDir = "";
let script = store.get("rp.script", null);        // path relative to the R folder, e.g. "scripts/analysis.R"
let savedCode = store.get("rp.savedCode", null);  // contents at last save or open
let syntaxErr = null;     // { line, msg }
let lintLines = new Set();

// ---- Bridge to the Android side ----
const bridge = window.RBridge;
let reqId = 0;
const pending = {};
window.__rb = (id, status, body) => { const p = pending[id]; delete pending[id]; if (p) p({ status, body }); };
function rreq(method, path, body, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    if (!bridge) { resolve({ status: 0, body: "No Android bridge" }); return; }
    const id = ++reqId;
    pending[id] = resolve;
    bridge.request(id, method, path, body || "", !!opts.binary, opts.timeout || 0);
  });
}
function qs(params) {
  return Object.keys(params).map((k) => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
}
function parseJson(s) { try { return JSON.parse(s); } catch (e) { return null; } }

// ---- Status ----
function setStatus(s, label) {
  state = s;
  const el = $("status");
  el.className = { ready: "ok", busy: "busy", down: "bad" }[s] || "";
  el.textContent = label;
}
function readyLabel() { return "R " + rVersion; }

// Returns the ping reply, or null. lastPingBusy tells a busy R (it accepted the connection but didn't
// answer in time) apart from no R at all (connection refused).
let lastPingBusy = false;
async function ping(timeout) {
  const r = await rreq("GET", "/ping", "", { timeout: timeout === undefined ? 3000 : timeout });
  lastPingBusy = false;
  if (r.status === 200) {
    const j = parseJson(r.body);
    if (j) { rVersion = j.r; hasLintr = !!j.lintr; return j; }
  }
  if (r.status === 0 && /Timeout/i.test(r.body)) lastPingBusy = true;
  return null;
}

// R is still running something (often a run started before the app was closed or reloaded).
// Wait for it instead of restarting R, then show the output of that run if R kept it.
async function waitForBusyR() {
  setStatus("busy", "R is busy…");
  addLine("hint", "R is still running your last code. Its output will appear here when it finishes.");
  const j = await ping(0);
  if (!j) { store.set("rp.pending", null); return connect(false); }
  ready(j);
  await recoverPending();
}
async function recoverPending() {
  const id = store.get("rp.pending", null);
  if (!id) return;
  store.set("rp.pending", null);
  const r = await rreq("GET", "/result?" + qs({ id }), "", { timeout: 15000 });
  const res = r.status === 200 ? parseJson(r.body) : null;
  if (res) {
    addLine("hint", "Output from the run that finished while the app was in the background:");
    await renderResult(res, {});
  }
}

async function connect(forceRestart) {
  if (!bridge) { setStatus("down", "Not in app"); return; }
  if (!bridge.termuxInstalled()) { setStatus("down", "Termux needed"); showSetup("termux"); return; }
  if (!bridge.hasPermission()) { setStatus("down", "Needs permission"); showSetup("permission"); return; }
  if (!forceRestart) {
    setStatus("checking", "Checking…");
    const j = await ping();
    if (j) { ready(j); await recoverPending(); return; }
    if (lastPingBusy) { await waitForBusyR(); return; }
    store.set("rp.pending", null);
  }
  setStatus("starting", "Starting R…");
  const err = bridge.startR(forceRestart ? "restart" : "start");
  if (err) { setStatus("down", "Couldn't start R"); showSetup("notrunning", err); return; }
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 1000));
    const j = await ping();
    if (j) { ready(j); return; }
  }
  setStatus("down", "R not running");
  showSetup("notrunning");
}

function ready(j) {
  setStatus("ready", readyLabel());
  clearSetup();
  if (!j.plots && !store.get("rp.noPlotsWarned", false)) {
    addLine("hint", "Plots aren't available in this R install. Re-run the Termux setup command to add plot support.");
    store.set("rp.noPlotsWarned", true);
  }
  scheduleCheck(0);
  if ($("lint").classList.contains("on")) renderLintIntro();
}

function statusTapped() {
  if (state === "down") connect(false);
  else if (state === "ready") toast("R " + rVersion + " is running in Termux");
}

window.onPermissionResult = (ok) => { if (ok) connect(false); else showSetup("permission"); };

// ---- Setup guidance ----
function showSetup(kind, detail) {
  clearSetup();
  const c = document.createElement("div");
  c.className = "card";
  c.id = "setupCard";
  if (kind === "termux") {
    c.innerHTML = '<h2>Install Termux first</h2>' +
      '<p>R runs inside Termux. Install it from F-Droid (the Play Store version is outdated and won\'t work).</p>' +
      '<div class="actions"><button class="primary" onclick="RBridge.openUrl(\'https://f-droid.org/packages/com.termux/\')">Get Termux</button>' +
      '<button onclick="connect(false)">I installed it</button></div>';
  } else if (kind === "permission") {
    c.innerHTML = '<h2>Allow R Pocket to start R</h2>' +
      '<p>R Pocket needs Termux\'s "Run commands" permission to start R in the background.</p>' +
      '<div class="actions"><button class="primary" onclick="RBridge.requestPermission()">Allow</button></div>' +
      '<p class="hint">If Android won\'t show the prompt, open Settings → Apps → R Pocket → Permissions → Additional permissions, and allow "Run commands in Termux environment".</p>';
  } else {
    c.innerHTML = '<h2>R isn\'t running yet</h2>' +
      '<ol><li>Open Termux and run this once (tap to copy):<br><code onclick="copyText(SETUP_CMD)">' + escapeHtml(SETUP_CMD) + '</code></li>' +
      '<li>Wait for "Done", then come back here and tap Start R.</li></ol>' +
      '<p class="hint">Already set up? Open Termux once so it\'s running, then try again. Some phones also need battery optimization turned off for Termux.</p>' +
      (detail ? '<p class="hint">Details: ' + escapeHtml(detail) + '</p>' : '') +

  nav.className = "plotnav";
  nav.innerHTML = '<button onclick="movePlot(-1)">&#8249;</button>' +
    '<span>' + (plotIndex + 1) + " of " + plots.length + "</span>" +
    (cur.saved ? '<span class="saved">&#10003; Saved</span>' : '<button onclick="savePlot(plots[plotIndex])">Save</button>') +
    '<button onclick="movePlot(1)">&#8250;</button>';
  p.appendChild(nav);
  if (cur.saved) {
    const where = document.createElement("div");
    where.className = "wd";
    where.textContent = "Saved to R/" + cur.saved;
    p.appendChild(where);
  }
  let x0 = null;
  img.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  img.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) movePlot(dx < 0 ? 1 : -1);
    x0 = null;
  });
}
function movePlot(d) {
  if (!plots.length) return;
  plotIndex = Math.max(0, Math.min(plots.length - 1, plotIndex + d));
  renderPlots();
}
async function savePlot(p, quiet) {
  if (!p || p.saved) return;
  if (state !== "ready" && state !== "busy") { toast("R isn't connected"); return; }
  const r = await rreq("POST", "/saveplot?" + qs({ name: p.name }), "", { timeout: 8000 });
  const j = parseJson(r.body);
  if (r.status === 200 && j && j.ok) {
    p.saved = j.path;
    if (!quiet) { toast("Saved to R/" + j.path); renderPlots(); }
  } else if (!quiet) {
    toast(r.status === 404 ? "This plot was made before R restarted, so it can't be saved" : "Couldn't save the plot");
  }
}
function toggleAutosave() {
  const on = !store.get("rp.autosave", false);
  store.set("rp.autosave", on);
  toast(on ? "New plots will be saved to R/plots" : "Auto-save is off");
}

// ---- Scripts ----
function scriptLabel() { return script ? script.split("/").pop() : "untitled.R"; }
function isDirty() { return savedCode === null ? editor.value.trim().length > 0 : editor.value !== savedCode; }
function updateScriptBar() {
  $("scriptName").innerHTML = "&#128196; <b>" + escapeHtml(scriptLabel()) + "</b>" + (isDirty() ? " &#8226;" : "") +
    (script && script.indexOf("/") > 0 ? " <span>in " + escapeHtml(script.slice(0, script.lastIndexOf("/"))) + "</span>" : "");
}
function setScript(path, code) {
  script = path;
  savedCode = code;
  store.set("rp.script", script);
  store.set("rp.savedCode", savedCode);
  updateScriptBar();
}
function needR() {
  if (state === "ready" || state === "busy") return true;
  toast("Connect to R first. Scripts are saved by R.");
  return false;
}

async function saveScript() {
  if (!script) { openSaveAs(); return; }
  if (!needR()) return;
  await writeScript(script);
}
async function writeScript(path) {
  const code = editor.value;
  const r = await rreq("POST", "/write?" + qs({ path }), code, { timeout: 8000 });
  const j = parseJson(r.body);
  if (r.status === 200 && j && j.ok) {
    setScript(j.path, code);
    toast("Saved " + j.path);
    return true;
  }
  toast("Couldn't save: " + ((j && j.error) || r.body));
  return false;
}
function openSaveAs() {
  if (!needR()) return;
  const suggested = script ? scriptLabel() : "";
  openSheet('<h2>Save script</h2>' +
    '<div class="sheetrow"><input id="saveName" placeholder="analysis.R" value="' + escapeHtml(suggested) + '"></div>' +
    '<div class="fielderr" id="saveErr"></div>' +
    '<div class="wd">Saved in your phone\'s R/scripts folder.</div>' +
    '<div class="sheetrow"><button class="primary" style="flex:1" onclick="confirmSaveAs()">Save</button></div>');
  const inp = $("saveName");
  inp.addEventListener("input", () => { $("saveErr").textContent = ""; });
  inp.focus();
}
async function confirmSaveAs() {
  let name = $("saveName").value.trim();
  if (!name) { $("saveErr").textContent = "Enter a file name"; return; }
  if (/[\/\\]/.test(name) || name === "." || name === "..") { $("saveErr").textContent = "Use a name without slashes"; return; }
  if (!/\.r$/i.test(name)) name += ".R";
  const path = "scripts/" + name;
  if (path !== script) {
    const r = await rreq("GET", "/files?" + qs({ dir: "scripts" }), "", { timeout: 5000 });
    const j = parseJson(r.body);
    if (j && j.files && j.files.some((f) => f.n === name) && !confirm(name + " already exists. Replace it?")) return;
  }
  if (await writeScript(path)) closeSheet();
}

async function openScript(path) {
  if (!needR()) return;
  if (isDirty() && !confirm("Discard unsaved changes to " + scriptLabel() + "?")) return;
  const r = await rreq("GET", "/read?" + qs({ path }), "", { timeout: 8000 });
  if (r.status !== 200) { const j = parseJson(r.body); toast("Couldn't open: " + ((j && j.error) || r.status)); return; }
  editor.value = r.body;
  saveEditor();
  setScript(path, r.body);
  syntaxErr = null; lintLines = new Set();
  renderDiag();
  setCursor(0);
  editor.scrollTop = 0;
  closeSheet();
  scheduleCheck(0);
  toast("Opened " + path);
}
function newScript() {
  if (isDirty() && !confirm("Discard unsaved changes to " + scriptLabel() + "?")) return;
  editor.value = "";
  saveEditor();
  setScript(null, null);
  syntaxErr = null; lintLines = new Set();
  renderDiag();
  renderGutter();
  closeSheet();
}

async function openScripts() {
  let html = '<h2>Scripts</h2>' +
    '<div class="item"><button class="main" onclick="newScript()">&#65291; New script</button></div>' +
    '<div class="item"><button class="main" onclick="openSaveAs()">Save as…</button></div>';
  if (state === "ready" || state === "busy") {
    const r = await rreq("GET", "/files?" + qs({ dir: "scripts" }), "", { timeout: 5000 });
    const j = parseJson(r.body);
    const files = (j && j.files ? j.files : []).filter((f) => !f.d && /\.r$/i.test(f.n));
    if (files.length) {
      html += '<div class="wd">In R/scripts</div>';
      files.sort((a, b) => a.n.localeCompare(b.n));
      for (const f of files) {
        html += '<div class="item"><button class="main" data-path="' + escapeHtml("scripts/" + f.n) + '">' + escapeHtml(f.n) +
          '<span class="sub">' + fmtSize(f.s) + "</span></button></div>";
      }
    } else {
      html += '<div class="wd">No saved scripts yet. Saved scripts go in your phone\'s R/scripts folder.</div>';
    }
  } else {
    html += '<div class="wd">Connect to R to see saved scripts.</div>';
  }
  openSheet(html);
  $("sheet").querySelectorAll("button[data-path]").forEach((b) => b.addEventListener("click", () => openScript(b.dataset.path)));
}

// ---- Files ----
async function loadFiles() {
  const f = $("files");
  if (state !== "ready" && state !== "busy") { f.innerHTML = '<div class="wd">Connect to R to see files.</div>'; return; }
  const r = await rreq("GET", "/files?" + qs({ dir: filesDir }), "", { timeout: 5000 });
  let j = parseJson(r.body);
  if (r.status === 404 && filesDir) { filesDir = ""; return loadFiles(); }
  if (r.status !== 200 || !j) { f.innerHTML = '<div class="wd">Couldn\'t list files.</div>'; return; }
  const shared = j.base.indexOf("storage/shared/R") >= 0;
  let html = '<div class="crumbs">' + (filesDir ? '<button onclick="upDir()">&#8592; Up</button>' : "") +
    '<span class="where">' + (shared ? "Internal storage › R" : escapeHtml(j.base)) +
    (filesDir ? " › " + escapeHtml(filesDir.split("/").join(" › ")) : "") + "</span>" +
    '<button onclick="loadFiles()">Refresh</button></div>';
  if (!j.files.length) html += '<div class="wd">' + (filesDir ? "This folder is empty." : "No files yet. Put data files in your phone's R folder to use them here.") + "</div>";
  j.files.sort((a, b) => (b.d - a.d) || a.n.localeCompare(b.n));
  for (const x of j.files) {
    html += '<div class="row" data-name="' + escapeHtml(x.n) + '" data-dir="' + x.d + '">' +
      '<span>' + (x.d ? "&#128193;" : "&#128196;") + '</span><span class="name">' + escapeHtml(x.n) + "</span>" +
      '<span class="size">' + (x.d ? "" : fmtSize(x.s)) + "</span></div>";
  }
  f.innerHTML = html;
  f.querySelectorAll(".row").forEach((row) => row.addEventListener("click", () => fileTapped(row.dataset.name, row.dataset.dir === "true")));
}
function upDir() {
  filesDir = filesDir.indexOf("/") >= 0 ? filesDir.slice(0, filesDir.lastIndexOf("/")) : "";
  loadFiles();
}
function fileTapped(name, isDir) {
  const rel = filesDir ? filesDir + "/" + name : name;
  if (isDir) { filesDir = rel; loadFiles(); return; }
  const ext = (name.split(".").pop() || "").toLowerCase();
  const q = JSON.stringify(rel);
  if (ext === "r") {
    openSheet('<h2>' + escapeHtml(name) + '</h2>' +
      '<div class="item"><button class="main" id="fOpen">Open in editor</button></div>' +
      '<div class="item"><button class="main" id="fSource">Run it with source()</button></div>' +
      '<div class="item"><button class="main" id="fInsert">Insert the file path</button></div>');
    $("fOpen").onclick = () => openScript(rel);
    $("fSource").onclick = () => { closeSheet(); run("source(" + q + ", echo = TRUE)"); };
    $("fInsert").onclick = () => { closeSheet(); insertAtCursor(q); };
    return;
  }
  if (ext === "png" || ext === "jpg" || ext === "jpeg") { previewImage(rel, ext); return; }
  let code;
  if (ext === "csv") code = "df <- read.csv(" + q + ")";
  else if (ext === "tsv" || ext === "txt") code = "df <- read.delim(" + q + ")";
  else if (ext === "rds") code = "obj <- readRDS(" + q + ")";
  else if (ext === "rdata" || ext === "rda") code = "load(" + q + ")";
  else code = q;
  insertAtCursor(code);
  toast("Added to editor");
}
async function previewImage(rel, ext) {
  const r = await rreq("GET", "/read?" + qs({ path: rel }), "", { binary: true, timeout: 15000 });
  if (r.status !== 200) { toast("Couldn't open the image"); return; }
  openSheet('<h2>' + escapeHtml(rel.split("/").pop()) + '</h2><img alt="" src="data:image/' + (ext === "png" ? "png" : "jpeg") + ";base64," + r.body + '">' +
    '<div class="wd">R/' + escapeHtml(rel) + "</div>");
}
function fmtSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}

// ---- Lint ----
function renderLintIntro() {
  const l = $("lint");
  if (state !== "ready" && state !== "busy") { l.innerHTML = '<div class="wd">Connect to R to lint your code.</div>'; return; }
  if (!hasLintr) {
    l.innerHTML = '<div class="card"><h2>Install lintr for style checks</h2>' +
      '<p>Syntax errors are already checked as you type. For style and common-mistake checks, install the <code>lintr</code> package. In Termux, run (tap to copy):</p>' +
      '<p><code onclick="copyText(LINTR_CMD)">' + escapeHtml(LINTR_CMD) + '</code></p>' +
      '<p class="hint">It takes several minutes. When it\'s done, tap ■ to restart R.</p>' +
      '<div class="actions"><button onclick="copyText(LINTR_CMD)">Copy command</button><button onclick="RBridge.openTermux()">Open Termux</button></div></div>';
    return;
  }
  if (!l.querySelector(".lintbar")) {
    l.innerHTML = '<div class="lintbar"><span>Check the editor\'s code with lintr</span><button class="primary" onclick="runLint()">Lint</button></div>';
  }
}
async function runLint() {
  if (state !== "ready") { toast(state === "busy" ? "R is busy" : "R isn't connected"); return; }
  const l = $("lint");
  const code = editor.value;
  if (!code.trim()) { toast("The editor is empty"); return; }
  setStatus("busy", "Linting…");
  l.innerHTML = '<div class="lintbar"><span>Linting…</span></div>';
  const r = await rreq("POST", "/lint", code, { timeout: 0 });
  setStatus("ready", readyLabel());
  const j = parseJson(r.body);
  if (r.status !== 200 || !j) { l.innerHTML = '<div class="wd">Lint failed.</div>'; return; }
  if (!j.installed) { hasLintr = false; renderLintIntro(); return; }
  let html = '<div class="lintbar"><span>' + (j.error ? "lintr hit an error" : j.lints.length ? j.lints.length + " issue" + (j.lints.length === 1 ? "" : "s") : "No issues found") +
    '</span><button class="primary" onclick="runLint()">Lint again</button></div>';
  if (j.error) html += '<div class="wd">' + escapeHtml(j.error) + "</div>";
  lintLines = new Set();
  j.lints.forEach((x, i) => {
    lintLines.add(x.line);
    html += '<div class="lintrow" data-i="' + i + '"><span class="loc">' + x.line + ":" + x.col + '</span><span><span class="t-' + escapeHtml(x.type) + '">' +
      escapeHtml(x.type) + "</span> " + escapeHtml(x.msg) + '<span class="linter">' + escapeHtml(x.linter) + "</span></span></div>";
  });
  l.innerHTML = html;
  l.querySelectorAll(".lintrow").forEach((row) => row.addEventListener("click", () => {
    const x = j.lints[+row.dataset.i];
    goToLine(x.line, x.col);
  }));
  renderGutter();
  if (!j.lints.length && !j.error) toast("No lint issues");
}

// ---- Tabs ----
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === name));
  if (name === "files") loadFiles();
  if (name === "lint") renderLintIntro();
}

// ---- Editor helpers ----
const SYMBOLS = [["<-", " <- "], ["|>", " |> "], ["%>%", " %>% "], ["$", "$"], ["~", " ~ "], ["()", "(", ")"],
  ["\"\"", "\"", "\""], ["[]", "[", "]"], ["{}", "{", "}"], [",", ", "], ["=", " = "], ["#", "# "],
  ["%in%", " %in% "], ["==", " == "], ["!", "!"], ["&", " & "], ["|", " | "], ["⇥", "  "]];
function insertAtCursor(before, after) {
  after = after || "";
  const s = editor.selectionStart, e = editor.selectionEnd, v = editor.value;
  const sel = v.slice(s, e);
  editor.value = v.slice(0, s) + before + sel + after + v.slice(e);
  const pos = s + before.length + sel.length;
  editor.setSelectionRange(pos, pos);
  editor.focus();
  saveEditor();
  renderGutter();
  updateScriptBar();
  scheduleCheck();
}
function buildSymbols() {
  const bar = $("symbols");
  for (const [label, before, after] of SYMBOLS) {
    const b = document.createElement("button");
    b.textContent = label;
    b.addEventListener("pointerdown", (e) => e.preventDefault());
    b.addEventListener("click", () => insertAtCursor(before, after));
    bar.appendChild(b);
  }
}
function saveEditor() { store.set("rp.code", editor.value); renderHighlight(); }

// Run buttons keep the editor's focus and cursor, so the keyboard doesn't jump around
document.querySelectorAll("#runbar button, #saveBtn").forEach((b) => b.addEventListener("pointerdown", (e) => e.preventDefault()));

// ---- Sheets: snippets and menu ----
function openSheet(html) { $("sheet").innerHTML = html; $("sheetWrap").classList.add("on"); }
function closeSheet() { $("sheetWrap").classList.remove("on"); }
window.handleBack = () => { if ($("sheetWrap").classList.contains("on")) { closeSheet(); return true; } return false; };

function openSnippets() {
  const list = store.get("rp.snippets", []);
  let html = '<h2>Snippets</h2><div class="sheetrow"><input id="snipName" placeholder="Name for current code">' +
    '<button class="primary" onclick="saveSnippet()">Save</button></div>';
  if (!list.length) html += '<div class="sheetrow hint">Save code you run often, then load it here with one tap.</div>';
  list.forEach((s, i) => {
    html += '<div class="item"><button class="main" onclick="loadSnippet(' + i + ')">' + escapeHtml(s.name) +
      '<span class="sub">' + escapeHtml(s.code.split("\n")[0]) + '</span></button>' +
      '<button class="icon" aria-label="Delete" onclick="deleteSnippet(' + i + ')">&#10005;</button></div>';
  });
  openSheet(html);
}
function saveSnippet() {
  const name = $("snipName").value.trim();
  if (!name) { toast("Give the snippet a name"); return; }
  if (!editor.value.trim()) { toast("The editor is empty"); return; }
  const list = store.get("rp.snippets", []);
  list.unshift({ name, code: editor.value });
  store.set("rp.snippets", list);
  openSnippets();
  toast("Snippet saved");
}
function loadSnippet(i) {
  const s = store.get("rp.snippets", [])[i];
  if (!s) return;
  if (editor.value.trim() && !confirm("Replace the code in the editor with \"" + s.name + "\"?")) return;
  editor.value = s.code;
  saveEditor();
  renderGutter();
  updateScriptBar();
  scheduleCheck();
  closeSheet();
}
function deleteSnippet(i) {
  const list = store.get("rp.snippets", []);
  list.splice(i, 1);
  store.set("rp.snippets", list);
  openSnippets();
}

function openMenu() {
  const auto = store.get("rp.autosave", false);
  openSheet('<h2>Menu</h2>' +
    '<div class="item"><button class="main" onclick="closeSheet();toggleAutosave()">Auto-save plots: ' + (auto ? "On" : "Off") +
      '<span class="sub">' + (auto ? "Every new plot is saved to R/plots" : "Plots are saved only when you tap Save") + '</span></button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();$(\'consoleOut\').innerHTML=\'\'">Clear console</button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();copyText($(\'consoleOut\').innerText)">Copy console output</button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();plots=[];plotIndex=-1;renderPlots()">Clear plots</button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();restartR()">Restart R</button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();stopR()">Stop R<span class="sub">Stops R and lets the phone sleep normally</span></button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();showSetup(\'notrunning\')">Setup help</button></div>' +
    '<div class="item"><button class="main" onclick="closeSheet();RBridge.openTermux()">Open Termux</button></div>');
}

// ---- Misc ----
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 2400);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

buildSymbols();
editor.value = store.get("rp.code", "# Welcome to R Pocket\nx <- rnorm(100)\nsummary(x)\nhist(x)\n");
updateScriptBar();
renderGutter();
renderHighlight();
document.addEventListener("visibilitychange", () => { if (!document.hidden && state === "down") connect(false); });
connect(false);
</script>
